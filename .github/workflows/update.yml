name: Aggiorna prezzi e statistiche

on:
  schedule:
    # Giorni feriali alle 22:00 UTC (23:00 in Italia d'inverno): dopo la chiusura di Milano e di Wall Street.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "config/allocations.json"
      - "scripts/update.py"

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scarica i prezzi e ricalcola
        run: python scripts/update.py
      - name: Salva i dati nel repository
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add docs/data/state.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Aggiorna dati $(date -u +%F)"
            git pull --rebase
            git push
          fi
